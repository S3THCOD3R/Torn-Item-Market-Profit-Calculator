# netlify.toml
# Configuration for the Torn Item Market Profit Calculator

# ─────────────────────────────────────────────────────────────
# BUILD SETTINGS
# ─────────────────────────────────────────────────────────────
[build]
  command = ""
  publish = "."

# ─────────────────────────────────────────────────────────────
# SERVERLESS FUNCTIONS
# ─────────────────────────────────────────────────────────────
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ─────────────────────────────────────────────────────────────
# API PROXY REDIRECTS
# ⚠️ ORDER MATTERS — API rules MUST come before the catch-all.
# ─────────────────────────────────────────────────────────────
[[redirects]]
  from = "/api/market"
  to = "/.netlify/functions/torn-proxy"
  status = 200
  force = true

[[redirects]]
  from = "/api/items"
  to = "/.netlify/functions/items-proxy"
  status = 200
  force = true

# ─────────────────────────────────────────────────────────────
# SECURITY HEADERS
# ─────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ─────────────────────────────────────────────────────────────
# CATCH-ALL FALLBACK
# ⚠️ THIS MUST COME LAST.
# ─────────────────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
