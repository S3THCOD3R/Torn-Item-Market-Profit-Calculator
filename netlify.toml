# netlify.toml
# Configuration for the Torn Item Market Profit Calculator

[build]
  command = ""
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ─────────────────────────────────────────────────────────────
# API PROXY REDIRECTS — all point to torn-proxy
# ⚠️ ORDER MATTERS — API rules MUST come before the catch-all.
# ─────────────────────────────────────────────────────────────
[[redirects]]
  from = "/api/market"
  to = "/.netlify/functions/torn-proxy"
  status = 200
  force = true

[[redirects]]
  from = "/api/items"
  to = "/.netlify/functions/torn-proxy"
  status = 200
  force = true

[[redirects]]
  from = "/api/bazaar"
  to = "/.netlify/functions/torn-proxy"
  status = 200
  force = true

# ─────────────────────────────────────────────────────────────
# SECURITY HEADERS
# ─────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ─────────────────────────────────────────────────────────────
# CATCH-ALL FALLBACK — must come last
# ─────────────────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
