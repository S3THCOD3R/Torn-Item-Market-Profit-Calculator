# netlify.toml
# Configuration for the Torn Item Market Profit Calculator
# Pins deploy settings, security headers, and the API proxy function.

# ─────────────────────────────────────────────────────────────
# BUILD SETTINGS
# ─────────────────────────────────────────────────────────────
[build]
  # No build command — this is a pure static site.
  command = ""
  # Serve files from the repository root (where index.html lives).
  publish = "."

# ─────────────────────────────────────────────────────────────
# SERVERLESS FUNCTIONS
# ─────────────────────────────────────────────────────────────
[functions]
  # Directory where Netlify looks for serverless functions.
  directory = "netlify/functions"
  # Bundle each function with esbuild for faster cold starts.
  node_bundler = "esbuild"

# ─────────────────────────────────────────────────────────────
# API PROXY REDIRECTS
# ⚠️ ORDER MATTERS — this MUST come before the catch-all below.
# Netlify evaluates redirects top-to-bottom and uses the first match.
# ─────────────────────────────────────────────────────────────
[[redirects]]
  from = "/api/market"
  to = "/.netlify/functions/torn-proxy"
  status = 200
  force = true

# ─────────────────────────────────────────────────────────────
# SECURITY HEADERS
# ─────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ─────────────────────────────────────────────────────────────
# CATCH-ALL FALLBACK
# ⚠️ THIS MUST COME LAST. If it came first, it would swallow
# /api/market and the proxy function would never be reached.
# ─────────────────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
